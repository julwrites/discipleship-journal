version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-discipleship_journal}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-discipleship_journal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    environment:
      # Database configuration - individual components only
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-discipleship_journal}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      CLOUD_SQL_INSTANCE: ${CLOUD_SQL_INSTANCE:-}
      # Other configuration
      PORT: ${PORT:-8080}
      APP_ENV: ${APP_ENV:-development}
      TEST_REAL_BIBLE_API: ${TEST_REAL_BIBLE_API:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-mock-project}
      BIBLE_API_URL: ${BIBLE_API_URL:-https://mock-bible-api.example.com}
      BIBLE_API_KEY: ${BIBLE_API_KEY:-REPLACE_WITH_YOUR_BIBLE_API_KEY}
      # For local dev, we might need to handle Firebase Auth.
      # If using an emulator or service account, mount it here.
    env_file:
      - .env
      - .env.local
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-mock-key}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-mock-project.firebaseapp.com}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-mock-project}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-mock-project.appspot.com}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-1234567890}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-1:1234567890:web:abcdef123456}
    env_file:
      - .env
      - .env.local
    ports:
      - "3000:80"
    depends_on:
      - api

  migrator:
    image: migrate/migrate
    volumes:
      - ./api/migrations:/migrations
      - ./scripts:/scripts
    env_file:
      - .env
      - .env.local
    command:
      - sh
      - -c
      - |
        # Build DATABASE_URL from individual components
        DATABASE_URL=$(/scripts/build-db-url.sh)
        echo "Using database URL: $(echo $DATABASE_URL | sed 's/:[^:]*@/:***@/')"
        migrate -path=/migrations -database="$DATABASE_URL" up
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
