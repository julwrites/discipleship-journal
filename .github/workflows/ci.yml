name: CI

on:
  pull_request:
    branches: [ main, staging ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install dependencies
        run: go mod tidy

      - name: Verify dependencies
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Check coverage
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out > coverage.txt
            ../scripts/check_backend_coverage.sh coverage.txt 84.0
          else
            echo "coverage.out not found, skipping coverage check"
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: api/coverage.txt
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/coverage-summary.json
          retention-days: 1

      - name: Build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm run test:e2e
        env:
          VITE_FIREBASE_API_KEY: mock-key
          VITE_FIREBASE_AUTH_DOMAIN: mock-project.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mock-project
          VITE_FIREBASE_STORAGE_BUCKET: mock-project.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: 1234567890
          VITE_FIREBASE_APP_ID: 1:1234567890:web:abcdef123456

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 1

  coverage-report:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend

      - name: Post coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./scripts/gh-actions/post-coverage-comment.js')
            await script({github, context})

  automerge:
    needs: [backend, frontend, e2e, coverage-report]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'julwrites' && github.event.pull_request.base.ref == 'staging'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Automerge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL" || true
          gh pr merge --rebase --delete-branch "$PR_URL"
