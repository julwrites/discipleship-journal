name: CI

on:
  pull_request:
    branches: [ main, staging ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: api/go.sum

      - name: Install dependencies
        run: go mod tidy

      - name: Verify dependencies
        run: go mod verify

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Check coverage
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out > coverage.txt
            ../scripts/check_backend_coverage.sh coverage.txt 72.8
          else
            echo "coverage.out not found, skipping coverage check"
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: api/coverage.txt

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: ./api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/coverage-summary.json

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          VITE_FIREBASE_API_KEY: mock-key
          VITE_FIREBASE_AUTH_DOMAIN: mock-project.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mock-project
          VITE_FIREBASE_STORAGE_BUCKET: mock-project.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: 1234567890
          VITE_FIREBASE_APP_ID: 1:1234567890:web:abcdef123456

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30

  coverage-report:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend

      - name: Post coverage comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let backendCoverage = 'N/A';
            let frontendStats = { statements: 'N/A', branches: 'N/A', functions: 'N/A', lines: 'N/A' };

            try {
              const backendOutput = fs.readFileSync('coverage/backend/coverage.txt', 'utf8');
              const totalLine = backendOutput.split('\n').find(line => line.includes('total:'));
              if (totalLine) {
                const parts = totalLine.trim().split(/\s+/);
                backendCoverage = parts[parts.length - 1];
              }
            } catch (e) {
              console.log('Error reading backend coverage:', e);
            }

            try {
              const frontendOutput = JSON.parse(fs.readFileSync('coverage/frontend/coverage-summary.json', 'utf8'));
              const total = frontendOutput.total;
              frontendStats = {
                statements: total.statements.pct + '%',
                branches: total.branches.pct + '%',
                functions: total.functions.pct + '%',
                lines: total.lines.pct + '%'
              };
            } catch (e) {
               console.log('Error reading frontend coverage:', e);
            }

            const header = '## Code Coverage Report';
            const body = `${header}

            | Component | Metric | Percentage |
            |---|---|---|
            | **Backend** | Total | ${backendCoverage} |
            | **Frontend** | Statements | ${frontendStats.statements} |
            | **Frontend** | Branches | ${frontendStats.branches} |
            | **Frontend** | Functions | ${frontendStats.functions} |
            | **Frontend** | Lines | ${frontendStats.lines} |
            `;

            const { owner, repo, number } = context.issue;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const botComment = comments.data.find(c => c.body.startsWith(header) && c.user.type === 'Bot');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: body
              });
            }
