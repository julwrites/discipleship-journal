name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Backend GCP configuration (from secrets)
  # Note: GCP project ID should match Firebase project ID
  GCP_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME }}
  GCP_ARTIFACT_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REPOSITORY }}

  # Frontend Firebase configuration
  FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify Artifact Registry Setup
        run: |
          echo "🔍 Verifying Artifact Registry setup..."
          echo "Project: ${{ env.GCP_PROJECT_ID }}"
          echo "Region: ${{ env.GCP_REGION }}"
          echo "Repository: ${{ env.GCP_ARTIFACT_REPOSITORY }}"
          echo "Full Docker path: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}"

          # Try to list repositories (more permissive than describe)
          echo ""
          echo "Listing Artifact Registry repositories in project ${{ env.GCP_PROJECT_ID }}..."
          gcloud artifacts repositories list \
            --project=${{ env.GCP_PROJECT_ID }} \
            --location=${{ env.GCP_REGION }} || true

          echo ""
          echo "⚠️ Note: If repository doesn't exist, Docker push will fail with 404."
          echo "Create it with:"
          echo "  gcloud artifacts repositories create ${{ env.GCP_ARTIFACT_REPOSITORY }} \\"
          echo "    --repository-format=docker \\"
          echo "    --location=${{ env.GCP_REGION }} \\"
          echo "    --project=${{ env.GCP_PROJECT_ID }}"

      - name: Authenticate Docker to Artifact Registry
        # Use Google's official action for Docker auth
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push Container to Artifact Registry
        run: |
          # Build image with Artifact Registry tag
          IMAGE_TAG=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_SERVICE_NAME }}:${{ github.sha }}

          echo "Building image: $IMAGE_TAG"
          docker build -t $IMAGE_TAG .

          echo "Pushing to Artifact Registry..."
          docker push $IMAGE_TAG

          echo "✅ Image pushed successfully to Artifact Registry"

      - name: Deploy to Cloud Run from Artifact Registry
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.GCP_SERVICE_NAME }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_SERVICE_NAME }}:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          env_vars: |
            APP_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}

  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISCIPLESHIP_JOURNAL }}'
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
