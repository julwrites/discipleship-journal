name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Backend GCP configuration (from secrets)
  # Note: GCP project ID should match Firebase project ID
  GCP_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME }}
  GCP_ARTIFACT_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REPOSITORY }}

  # Frontend Firebase configuration
  FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Validate GCP Configuration
        run: |
          echo "🔍 Validating GCP configuration..."

          # Check if values are set (without echoing them since they're secrets)
          if [ -z "${{ env.GCP_PROJECT_ID }}" ]; then
            echo "❌ ERROR: GCP_PROJECT_ID is empty!"
            exit 1
          fi

          if [ -z "${{ env.GCP_REGION }}" ]; then
            echo "❌ ERROR: GCP_REGION is empty!"
            exit 1
          fi

          if [ -z "${{ env.GCP_ARTIFACT_REPOSITORY }}" ]; then
            echo "❌ ERROR: GCP_ARTIFACT_REPOSITORY is empty!"
            exit 1
          fi

          echo "✅ All required values are set (values masked as secrets)"

          # Test project access by getting project info (won't echo project ID)
          echo "Testing project access..."
          gcloud projects describe ${{ env.GCP_PROJECT_ID }} --format="value(projectId)" || {
            echo "❌ ERROR: Cannot access project"
            echo "Possible issues:"
            echo "1. Project doesn't exist: https://console.cloud.google.com/"
            echo "2. Service account doesn't have access"
            echo "3. Project ID format is wrong"
            echo ""
            echo "Project ID should be like: 'discipleship-journal-52a2c' (no 'projects/' prefix)"
            exit 1
          }

          echo "✅ Project access verified"

          # Enable Artifact Registry API if needed
          echo "Checking Artifact Registry API..."
          gcloud services enable artifactregistry.googleapis.com --project=${{ env.GCP_PROJECT_ID }} || {
            echo "⚠️ Could not enable Artifact Registry API (might already be enabled)"
          }

      - name: Verify Artifact Registry Setup
        run: |
          echo "🔍 Checking Artifact Registry..."

          # Try to list repositories (won't echo values due to secret masking)
          echo "Listing repositories in region ${{ env.GCP_REGION }}..."
          gcloud artifacts repositories list \
            --project=${{ env.GCP_PROJECT_ID }} \
            --location=${{ env.GCP_REGION }} 2>&1 || {
            echo "⚠️ Could not list repositories (might be permission issue)"
            echo "Continuing anyway - Docker push will fail if repository doesn't exist"
          }

      - name: Authenticate Docker to Artifact Registry
        # Use Google's official action for Docker auth
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and Push Container to Artifact Registry
        run: |
          # Build image with Artifact Registry tag
          IMAGE_TAG=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_SERVICE_NAME }}:${{ github.sha }}

          echo "Building image: $IMAGE_TAG"
          docker build -t $IMAGE_TAG .

          echo "Pushing to Artifact Registry..."
          docker push $IMAGE_TAG

          echo "✅ Image pushed successfully to Artifact Registry"

      - name: Deploy to Cloud Run from Artifact Registry
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.GCP_SERVICE_NAME }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_SERVICE_NAME }}:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          env_vars: |
            APP_ENV=production
            DATABASE_URL=${{ secrets.DATABASE_URL }}

  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISCIPLESHIP_JOURNAL }}'
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
