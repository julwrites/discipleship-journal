name: Deploy (Staging)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

env:
  # Backend GCP configuration
  # Shared infrastructure secrets (same project/region/repo as production)
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCP_SERVICE_NAME: ${{ secrets.STG_GCP_SERVICE_NAME }}
  GCP_ARTIFACT_REPOSITORY: ${{ secrets.GCP_ARTIFACT_REPOSITORY }}

  # Staging Firebase project (separate from production)
  FIREBASE_PROJECT_ID: ${{ secrets.STG_FIREBASE_PROJECT_ID }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker to use gcloud as credential helper
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Validate Configuration
        run: |
          echo "🔍 Validating staging configuration..."
          if [ -z "${{ env.GCP_PROJECT_ID }}" ]; then
            echo "❌ ERROR: GCP_PROJECT_ID is empty!"
            exit 1
          fi
          if [ -z "${{ env.GCP_REGION }}" ]; then
            echo "❌ ERROR: GCP_REGION is empty!"
            exit 1
          fi
          if [ -z "${{ env.GCP_SERVICE_NAME }}" ]; then
            echo "❌ ERROR: STG_GCP_SERVICE_NAME is empty!"
            exit 1
          fi
          if [ -z "${{ env.GCP_ARTIFACT_REPOSITORY }}" ]; then
            echo "❌ ERROR: GCP_ARTIFACT_REPOSITORY is empty!"
            exit 1
          fi
          echo "✅ Staging configuration validated"

      - name: Build and Push Container to Artifact Registry
        run: |
          IMAGE_TAG=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_SERVICE_NAME }}:${{ github.sha }}

          echo "Building staging image: $IMAGE_TAG"
          docker build -t $IMAGE_TAG .

          echo "Pushing to Artifact Registry..."
          docker push $IMAGE_TAG

          echo "✅ Staging image pushed successfully to Artifact Registry"

      - name: Deploy to Cloud Run from Artifact Registry
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.GCP_SERVICE_NAME }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_SERVICE_NAME }}:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          flags: '--service-account=${{ secrets.GCP_SERVICE_ACCOUNT }} --allow-unauthenticated'
          env_vars: |
            APP_ENV=staging
            GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }}
            FIREBASE_PROJECT_ID=${{ secrets.STG_FIREBASE_PROJECT_ID }}
            # Application secrets (STG_DJ_DB_*) are loaded from Google Secret Manager at runtime

  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          FIREBASE_API_KEY: ${{ secrets.STG_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.STG_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.STG_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STG_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.STG_FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.STG_FIREBASE_MEASUREMENT_ID }}
          GCP_API_URL: ${{ secrets.STG_GCP_API_URL }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.STG_FIREBASE_SERVICE_ACCOUNT_DISCIPLESHIP_JOURNAL }}'
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
