name: Migration - Extract Postgres to CSV

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment DB Secrets to pull (staging/production)'
        required: true
        default: 'staging'

jobs:
  extract-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (CI/CD Identity)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Cloud SQL Proxy
        run: |
          wget https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64 -O cloud-sql-proxy
          chmod +x cloud-sql-proxy
          
          # Launch the proxy connecting to the OLD Google Cloud SQL Postgres Instance. 
          # Ensure it uses the explicit authentication JSON mapped from GitHub Secrets
          # --auto-iam-authn is required for IAM authentication to work smoothly
          export GOOGLE_APPLICATION_CREDENTIALS=${{ env.GOOGLE_GHA_CREDS_PATH }}
          ./cloud-sql-proxy --auto-iam-authn ${{ secrets.CLOUD_SQL_INSTANCE }} &
          
          # Wait a moment for proxy to initialize
          sleep 5

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set Environment Secrets
        id: vars
        run: |
          if [ "${{ github.event.inputs.target_env }}" == "production" ]; then
            ENV_PREFIX="PROD"
          else
            ENV_PREFIX="STG"
          fi
          
          # Get the database name from the secret manager (same for TiDB and Postgres)
          DB_NAME=$(gcloud secrets versions access latest --secret="${ENV_PREFIX}_DJ_DB_NAME")
          
          # Generate short-lived OAuth token for IAM Auth based on the impersonated identity
          IAM_TOKEN=$(gcloud auth print-access-token)
          
          # Get the email of the impersonated service account and clean it for Postgres
          SA_EMAIL=${{ secrets.GCP_SERVICE_ACCOUNT }}
          DB_USER=$(echo "$SA_EMAIL" | sed 's/\.gserviceaccount\.com//')
          
          # Mask token so it doesn't leak in logs
          echo "::add-mask::$IAM_TOKEN"
          
          echo "PG_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "PG_PORT=5432" >> $GITHUB_ENV
          echo "PG_USER=$DB_USER" >> $GITHUB_ENV
          echo "PG_PASSWORD=$IAM_TOKEN" >> $GITHUB_ENV
          echo "PG_DBNAME=$DB_NAME" >> $GITHUB_ENV

      - name: Build and Run Data Extractor Image
        run: |
          # Build a quick Python Image wrapping our script
          docker build -t pg_extractor -f scripts/migration_env/Dockerfile .
          mkdir -p ./csv_extracts
          
          # Run the extraction (connecting to Proxy on 127.0.0.1 over Docker host network)
          docker run \
            --network host \
            -e PG_HOST=$PG_HOST \
            -e PG_PORT=$PG_PORT \
            -e PG_USER=$PG_USER \
            -e PG_PASSWORD=$PG_PASSWORD \
            -e PG_DBNAME=$PG_DBNAME \
            -v $(pwd):/app \
            pg_extractor python3 /app/scripts/extract_postgres_to_csv.py --out-dir /app/csv_extracts
            
      - name: Upload CSV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: migration-csv-data
          path: ./csv_extracts/*.csv
          retention-days: 1
