name: Migration - Extract Postgres to CSV

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment DB Secrets to pull (staging/production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  extract-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Impersonating App Service Account)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Setup Cloud SQL Proxy
        run: |
          wget https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64 -O cloud-sql-proxy
          chmod +x cloud-sql-proxy
          
          # Launch the proxy connecting to the OLD Google Cloud SQL Postgres Instance. 
          ./cloud-sql-proxy ${{ secrets.CLOUD_SQL_INSTANCE }} &
          
          # Wait a moment for proxy to initialize
          sleep 5

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set Environment Secrets
        id: vars
        run: |
          if [ "${{ github.event.inputs.target_env }}" == "production" ]; then
            ENV_PREFIX="PROD"
          else
            ENV_PREFIX="STG"
          fi
          
          # Get the database name from the secret manager 
          DB_NAME=$(gcloud secrets versions access latest --secret="${ENV_PREFIX}_DJ_DB_NAME")
          
          # Fetch the legacy postgres password directly from Secret Manager's DB_PASSWORD
          PG_EXTRACT_PASSWORD=$(gcloud secrets versions access latest --secret="DB_PASSWORD")
          
          # Fetch the new TiDB credentials
          TIDB_HOST=$(gcloud secrets versions access latest --secret="${ENV_PREFIX}_DJ_DB_HOST")
          TIDB_USER=$(gcloud secrets versions access latest --secret="${ENV_PREFIX}_DJ_DB_USERNAME")
          TIDB_PASSWORD=$(gcloud secrets versions access latest --secret="${ENV_PREFIX}_DJ_DB_PASSWORD")
          
          # Mask password securely
          echo "::add-mask::$PG_EXTRACT_PASSWORD"
          echo "::add-mask::$TIDB_PASSWORD"
          
          echo "PG_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "PG_PORT=5432" >> $GITHUB_ENV
          echo "PG_USER=postgres" >> $GITHUB_ENV
          echo "PG_PASSWORD=${PG_EXTRACT_PASSWORD}" >> $GITHUB_ENV
          echo "PG_DBNAME=$DB_NAME" >> $GITHUB_ENV
          
          echo "TIDB_HOST=${TIDB_HOST}" >> $GITHUB_ENV
          echo "TIDB_USER=${TIDB_USER}" >> $GITHUB_ENV
          echo "TIDB_PASSWORD=${TIDB_PASSWORD}" >> $GITHUB_ENV

      - name: Build and Run Data Extractor Image
        run: |
          # Build a quick Python Image wrapping our script
          docker build -t pg_extractor -f scripts/migration_env/Dockerfile .
          mkdir -p ./csv_extracts
          
          # Run the extraction (connecting to Proxy on 127.0.0.1 over Docker host network)
          docker run \
            --network host \
            -e PG_HOST=$PG_HOST \
            -e PG_PORT=$PG_PORT \
            -e PG_USER=$PG_USER \
            -e PG_PASSWORD=$PG_PASSWORD \
            -e PG_DBNAME=$PG_DBNAME \
            -v $(pwd):/app \
            pg_extractor python3 /app/scripts/extract_postgres_to_csv.py --out-dir /app/csv_extracts
            
      - name: Import Extracted CSVs into TiDB
        run: |
          # Run the importer script inside the same python environment
          docker run \
            --network host \
            -e TIDB_HOST=$TIDB_HOST \
            -e TIDB_USER=$TIDB_USER \
            -e TIDB_PASSWORD=$TIDB_PASSWORD \
            -e PG_DBNAME=$PG_DBNAME \
            -v $(pwd):/app \
            pg_extractor python3 /app/scripts/import_csv_to_tidb.py \
              --host "$TIDB_HOST" \
              --user "$TIDB_USER" \
              --password "$TIDB_PASSWORD" \
              --dbname "$PG_DBNAME" \
              --csv-dir /app/csv_extracts
            
      - name: Upload CSV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: migration-csv-data
          path: ./csv_extracts/*.csv
          retention-days: 1
