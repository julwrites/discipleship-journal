basePath: /
definitions:
  handlers.AskAIRequest:
    properties:
      context:
        type: string
      prompt:
        type: string
    required:
    - context
    - prompt
    type: object
  handlers.ChatRequest:
    properties:
      passage:
        minLength: 5
        type: string
      prompt:
        minLength: 2
        type: string
      themes:
        items:
          type: string
        type: array
    required:
    - passage
    - prompt
    type: object
  handlers.ChatResponse:
    properties:
      response:
        type: string
    type: object
  handlers.CreateNoteRequest:
    properties:
      content:
        additionalProperties: true
        type: object
      title:
        maxLength: 100
        minLength: 1
        type: string
    required:
    - content
    - title
    type: object
  handlers.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handlers.Note:
    properties:
      content:
        additionalProperties: true
        type: object
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handlers.NotesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.Note'
        type: array
      meta:
        $ref: '#/definitions/handlers.Meta'
    type: object
  handlers.RegisterDeviceRequest:
    properties:
      device_type:
        type: string
      token:
        type: string
    required:
    - token
    type: object
  handlers.UpdateUserRequest:
    properties:
      avatar_url:
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - full_name
    type: object
  handlers.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      firebase_uid:
        type: string
      full_name:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
  models.ReadingPlan:
    properties:
      created_at:
        type: string
      days:
        type: integer
      description:
        type: string
      id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.UserReadingPlan:
    properties:
      created_at:
        type: string
      id:
        type: string
      reading_plan_id:
        type: string
      start_date:
        type: string
      status:
        description: active, completed
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for the Discipleship Journal application.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Discipleship Journal API
  version: "1.0"
paths:
  /api/ai/ask:
    post:
      consumes:
      - application/json
      description: Ask AI a question based on general context
      parameters:
      - description: Ask AI Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AskAIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ChatResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ask AI
      tags:
      - chat
  /api/bible/passage:
    get:
      consumes:
      - application/json
      description: Fetch a bible passage from the external API
      parameters:
      - description: Bible Reference (e.g. John 3:16)
        in: query
        name: ref
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Reference is required
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get Bible Passage
      tags:
      - bible
  /api/chat:
    post:
      consumes:
      - application/json
      description: Chat with Bible AI using passage context
      parameters:
      - description: Chat Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ChatResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Chat with AI
      tags:
      - chat
  /api/my-reading-plans:
    get:
      consumes:
      - application/json
      description: Get a list of reading plans the user is subscribed to
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get user's reading plans
      tags:
      - reading-plans
  /api/my-reading-plans/{id}/progress:
    post:
      consumes:
      - application/json
      description: Mark a specific day in a reading plan as complete
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: string
      - description: Day Number
        in: body
        name: day_number
        required: true
        schema:
          type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Mark a day as complete
      tags:
      - reading-plans
  /api/notes:
    get:
      consumes:
      - application/json
      description: Fetch all notes belonging to the authenticated user, with pagination
        and search
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search query
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.NotesResponse'
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get all notes for user
      tags:
      - notes
    post:
      consumes:
      - application/json
      description: Create a new journal note
      parameters:
      - description: Create Note Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create a new note
      tags:
      - notes
  /api/notes/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a journal note by ID
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "403":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Note not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Delete a note
      tags:
      - notes
    get:
      consumes:
      - application/json
      description: Fetch a specific note by ID
      parameters:
      - description: Note ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Note'
        "403":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Note not found
          schema:
            type: string
      summary: Get a single note
      tags:
      - notes
    put:
      consumes:
      - application/json
      description: Update an existing journal note
      parameters:
      - description: Update Note Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateNoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Note not found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Update a note
      tags:
      - notes
  /api/notifications/register:
    post:
      consumes:
      - application/json
      description: Registers a Firebase Cloud Messaging token for the user to receive
        push notifications.
      parameters:
      - description: Device Registration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Register FCM token
      tags:
      - notifications
  /api/reading-plans:
    get:
      consumes:
      - application/json
      description: Get a list of all available reading plans
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get all reading plans
      tags:
      - reading-plans
  /api/reading-plans/{id}:
    get:
      consumes:
      - application/json
      description: Get details of a specific reading plan including days
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ReadingPlan'
      summary: Get a reading plan
      tags:
      - reading-plans
  /api/reading-plans/{id}/subscribe:
    post:
      consumes:
      - application/json
      description: Subscribe the current user to a reading plan
      parameters:
      - description: Plan ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserReadingPlan'
      summary: Subscribe to a reading plan
      tags:
      - reading-plans
  /users:
    post:
      consumes:
      - application/json
      description: Register a new user or update existing one based on Firebase UID
      parameters:
      - description: User details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create or update a user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update existing user details
      parameters:
      - description: User details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a user
      tags:
      - users
  /users/me:
    get:
      description: Get the profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.User'
      summary: Get current user
      tags:
      - users
swagger: "2.0"
